<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17142b">
  <title>星詠みのこはく — 幻想シューティング</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="星詠みのこはく ホーム"><span class="brand-mark" aria-hidden="true">✦</span> <span>星詠みのこはく</span></a>
      <p>星の札で、いたずら妖精たちをおしおき！</p>
    </header>

    <section class="game-card" aria-label="ゲーム画面">
      <div class="hud" aria-live="polite">
        <div><span class="hud-label">SCORE</span><strong id="score">00000</strong></div>
        <div><span class="hud-label">残機</span><strong id="lives">♥ ♥ ♥</strong></div>
        <div><span class="hud-label">BEST</span><strong id="best">00000</strong></div>
      </div>
      <div class="canvas-wrap">
        <canvas id="game" width="800" height="600" aria-label="星詠みのこはくの幻想シューティングゲーム"></canvas>
        <div id="overlay" class="overlay">
          <div class="overlay-card">
            <img class="hero-portrait" src="assets/kohaku.svg" alt="星詠みのこはく" width="110" height="130">
            <p class="hero-name">星詠みの巫女・こはく</p>
            <h1 id="overlay-title">星詠みのこはく</h1>
            <p id="overlay-message">ふしぎな神社に迷いこんだ妖精たち。星の札を放って、夜空の平和を取りもどそう！</p>
            <button id="start-button" type="button">出撃する</button>
            <small>移動：← → / A D　　ショット：スペース</small>
          </div>
        </div>
      </div>
      <div class="touch-controls" aria-label="タッチ操作">
        <button type="button" data-control="left" aria-label="左へ">◀</button>
        <button type="button" data-control="fire" aria-label="ショット">✦</button>
        <button type="button" data-control="right" aria-label="右へ">▶</button>
      </div>
    </section>
    <footer>妖精を逃がすと残機が減るよ。こはくを動かして、たくさんお札を当てよう！</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
