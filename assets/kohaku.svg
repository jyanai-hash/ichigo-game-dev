<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260" role="img" aria-labelledby="title desc">
  <title id="title">星詠みの巫女・こはく</title>
  <desc id="desc">桜色のリボンと白い袖を身につけた、星を司るかわいい巫女の女の子。</desc>
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#76508c"/><stop offset="1" stop-color="#35264f"/></linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5a8c9"/><stop offset="1" stop-color="#d85e99"/></linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffe9d9"/><stop offset="1" stop-color="#f9cbbf"/></linearGradient>
  </defs>
  <!-- Hair silhouette and side locks -->
  <path d="M53 88Q39 35 83 21Q119 2 153 29Q188 44 175 105L166 159 56 158Z" fill="url(#hair)"/>
  <path d="M59 85Q38 105 48 170L66 180 78 114M159 82Q183 108 173 166L155 181 145 112" fill="#513765" stroke="#35264f" stroke-width="5" stroke-linejoin="round"/>
  <!-- Ribbon -->
  <path d="M151 38Q171 20 190 35L177 53 195 64Q174 77 156 57Z" fill="#f58eb8" stroke="#ffe0ee" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="164" cy="49" r="8" fill="#ffe6a1"/>
  <!-- Face -->
  <path d="M71 75Q73 43 112 43Q153 43 154 79L148 111Q139 137 112 141Q84 137 75 110Z" fill="url(#face)"/>
  <!-- Bangs -->
